[package]
name = "ley"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A single-machine search engine with a controlled crawler and BM25 retrieval"
license = "MIT"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
libc = "=0.2.190"
encoding_rs = "=0.8.42"
ego-tree = "=0.11.0"
flate2 = "=1.1.9"
http-body = "=1.1.0"
httpdate = "=1.0.3"
html5ever = "=0.39.0"
hmac = "=0.12.1"
icu_casemap = "=2.3.0"
icu_normalizer = "=2.3.0"
icu_properties = "=2.3.0"
mime = "=0.3.17"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
scraper = "=0.27.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.53.2", features = ["rt", "net", "macros"] }
unicode-segmentation = "=1.13.3"
url = "=2.5.8"

[dev-dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
tower = { version = "=0.5.3", features = ["util"] }
